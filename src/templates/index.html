<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Research & 3D Simulation Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; }
        #chat-container { width: 40%; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; }
        #viewport-container { width: 60%; position: relative; background: #020617; display: flex; align-items: center; justify-content: center; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #1e293b; }
        .msg { margin-bottom: 12px; }
        .msg.user { color: #38bdf8; font-weight: bold; }
        .msg.bot { color: #a7f3d0; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        #canvas3d { width: 100%; height: 100%; }
        #status-overlay { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85); padding: 12px 18px; border-radius: 6px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="chat-container">
        <h2>Research Workspace</h2>
        <br>
        <div id="chat-box">
            <div class="msg bot">System: Enter your research objective or project concept below.</div>
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="e.g. Design a glasses-free 3D display...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div id="viewport-container">
        <div id="status-overlay">
            <strong>Evidence Level:</strong> <span id="evidence-level">Conceptual Visualization</span>
        </div>
        <div id="canvas3d"></div>
    </div>

    <script>
        // Set up Three.js 3D Viewport
        const container = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        camera.position.z = 4;

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // Chat & API Integration
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const text = input.value.trim();

            if (!text) return;

            chatBox.innerHTML += `<div class="msg user">User: ${text}</div>`;
            input.value = '';

            const res = await fetch('/api/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await res.json();
            chatBox.innerHTML += `<div class="msg bot"><strong>[Layer 1 Spec]:</strong> Objective set to "${data.spec.objective}"</div>`;
            chatBox.innerHTML += `<div class="msg bot"><strong>[Layer 2 Decision]:</strong> ${data.decision.action} — ${data.decision.detail}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
